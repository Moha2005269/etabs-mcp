[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "etabs-mcp"
version = "0.3.0"
description = "Model Context Protocol server that lets AI agents drive CSI ETABS (v22+) through its official API: modeling, loads, analysis, design, results and the interactive database."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["etabs", "mcp", "structural-engineering", "csi", "oapi", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "mcp>=1.10,<2",
  "pydantic>=2.6",
  "pythonnet>=3.0.3; sys_platform == 'win32'",
  "pywin32>=306; sys_platform == 'win32'",
  "comtypes>=1.2; sys_platform == 'win32'",
  "pillow>=10",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
etabs-mcp = "etabs_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/etabs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: requires a local ETABS installation (run with --live)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Broad excepts are intentional at the COM / Win32 boundary, where any .NET exception type can surface.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/", ".scratch/", "tools/ApiDump/bin/", "tools/ApiDump/obj/", ".github/"]
